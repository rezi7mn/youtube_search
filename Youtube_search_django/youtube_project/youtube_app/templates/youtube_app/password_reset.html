{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>パスワード再設定 - YouTube検索アプリ</title>
    <link rel="stylesheet" href="{% static 'youtube_app/style.css' %}">
</head>
<body style="background-color: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0;">

    <div style="text-align: center; margin-bottom: 30px;">
        <h1 style="margin: 0; font-size: 2em; color: #cc0000;">YouTube検索アプリ</h1>
        <p style="color: #aaa; margin: 5px 0 0 0;">パスワードの再設定</p>
    </div>

    <div style="background: #1e293b; padding: 40px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); box-sizing: border-box;">
        <h2 style="margin-top: 0; text-align: center; font-size: 1.2em; margin-bottom: 20px; color:">メールアドレスを入力してください</h2>
        
        <p style="color: #aaa; font-size: 0.9em; line-height: 1.6; margin-bottom: 25px;">
            ご登録済みのメールアドレスを入力して「送信」ボタンを押してください。パスワードを再設定するためのリンクを記載したメールをお送りします。
        </p>

        <form method="post">
            {% csrf_token %}
            
            {% if form.email.errors %}
                <div style="padding: 10px; border-radius: 4px; background: rgba(204, 0, 0, 0.1); border: 1px solid #cc0000; color: #ff4d4d; font-size: 0.85em; margin-bottom: 15px;">
                    {{ form.email.errors.0 }}
                </div>
            {% endif %}

            <div style="margin-bottom: 25px;">
                <label style="display: block; margin-bottom: 8px; font-size: 0.9em; color: #eee;">メールアドレス</label>
                {{ form.email }}
            </div>

            <button type="submit" style="width: 100%; padding: 12px; background: #cc0000; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 15px;">
                リセットリンクを送信
            </button>
        </form>

        <div style="text-align: center; margin-top: 20px;">
            <a href="{% url 'youtube_app:login' %}" style="color: #888; font-size: 0.85em; text-decoration: none;">
                ログイン画面に戻る
            </a>
        </div>
    </div>
</body>
</html>
