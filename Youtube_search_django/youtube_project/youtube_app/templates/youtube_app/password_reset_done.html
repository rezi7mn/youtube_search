{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>メール送信完了 - YouTube検索アプリ</title>
    <link rel="stylesheet" href="{% static 'youtube_app/style.css' %}">
</head>
<body style="background-color: #0f172a; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;">
    <div style="background: #1e293b; padding: 40px; border-radius: 12px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5);">
        <h2 style="color: #4caf50;">📩 メールを送信しました</h2>
        <p style="color: #aaa; font-size: 0.9em; line-height: 1.6; margin-top: 20px;">
            ご入力いただいたメールアドレス宛に、パスワード再設定用のリンクをお送りしました。メール内の指示に従って手続きを完了させてください。
        </p>
        <p style="color: #888; font-size: 0.8em; margin-top: 15px;">※メールが届かない場合は、迷惑メールフォルダをご確認ください。</p>
        <a href="{% url 'youtube_app:login' %}" class="primary-button" style="display: block; margin-top: 30px; text-decoration: none;">ログイン画面へ戻る</a>
    </div>
</body>
</html>
